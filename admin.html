<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kids Academy - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff8e9;
    color:#29150d;
}

header{
    background:#29150d;
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    color:#e5aa2e;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
}

input,textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ddd;
    border-radius:8px;
}

textarea{
    min-height:100px;
}

button{
    background:#e5aa2e;
    color:#29150d;
    border:0;
    padding:12px 20px;
    margin-top:15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

.notice{
    background:#fff8e9;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    border-left:5px solid #e5aa2e;
}

.delete{
    background:#29150d;
    color:white;
    padding:8px 14px;
}

.success{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>Kids Academy Public School</h1>
    <p>Online Admin Management</p>
</header>

<div class="container">

<!-- SCHOOL INFORMATION -->

<div class="card">

<h2>🏫 School Information</h2>

<label>School Name</label>
<input id="schoolName"
value="Kids Academy Public School">

<label>Address</label>
<input id="address"
value="Manikpur, Pirpainti Bazar">

<label>Principal Name</label>
<input id="principal"
value="Md Imtiyaz (Monu)">

<label>Qualification</label>
<input id="qualification"
value="B.Com & B.Ed">

<button onclick="saveSchool()">
Save School Information
</button>

<p id="schoolMessage" class="success"></p>

</div>


<!-- TEACHERS -->

<div class="card">

<h2>👨‍🏫 Teachers</h2>

<input id="teacher1" placeholder="Teacher 1 Name">
<input id="teacher2" placeholder="Teacher 2 Name">
<input id="teacher3" placeholder="Teacher 3 Name">
<input id="teacher4" placeholder="Teacher 4 Name">
<input id="teacher5" placeholder="Teacher 5 Name">
<input id="teacher6" placeholder="Teacher 6 Name">
<input id="teacher7" placeholder="Teacher 7 Name">
<input id="teacher8" placeholder="Teacher 8 Name">

<button onclick="saveTeachers()">
Save Teachers
</button>

<p id="teacherMessage" class="success"></p>

</div>


<!-- NOTICE -->

<div class="card">

<h2>📢 School Notice</h2>

<textarea id="noticeText"
placeholder="यहाँ नया notice लिखें..."></textarea>

<button onclick="addNotice()">
Add Notice
</button>

<div id="noticeList"></div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    remove
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyDH5Qd0S0gfuCX519aN-K9eLQtZYReyJ4Q",

    authDomain:
    "kids-academy-public-school.firebaseapp.com",

    databaseURL:
    "https://kids-academy-public-school-default-rtdb.asia-southeast1.firebasedatabase.app/",

    projectId:
    "kids-academy-public-school",

    storageBucket:
    "kids-academy-public-school.firebasestorage.app",

    messagingSenderId:
    "267983271088",

    appId:
    "1:267983271088:web:b172e2f3077492848bb775"

};


/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* SAVE SCHOOL */

window.saveSchool = function(){

    const school = {

        name:
        document.getElementById("schoolName").value,

        address:
        document.getElementById("address").value,

        principal:
        document.getElementById("principal").value,

        qualification:
        document.getElementById("qualification").value

    };

    set(ref(db,"school"),school)

    .then(()=>{

        document.getElementById("schoolMessage").innerHTML=
        "✅ School information online save हो गई।";

    })

    .catch((error)=>{

        alert("Error: "+error.message);

    });

};


/* SAVE TEACHERS */

window.saveTeachers = function(){

    const teachers = {};

    for(let i=1;i<=8;i++){

        teachers["teacher"+i] =
        document.getElementById("teacher"+i).value;

    }

    set(ref(db,"teachers"),teachers)

    .then(()=>{

        document.getElementById("teacherMessage").innerHTML=
        "✅ Teachers online save हो गए।";

    })

    .catch((error)=>{

        alert("Error: "+error.message);

    });

};


/* ADD NOTICE */

window.addNotice = function(){

    const text =
    document.getElementById("noticeText").value.trim();

    if(text===""){

        alert("पहले notice लिखिए।");
        return;

    }

    push(ref(db,"notices"),{

        text:text,
        date:new Date().toLocaleDateString("en-IN")

    })

    .then(()=>{

        document.getElementById("noticeText").value="";

        alert("✅ Notice online add हो गया।");

    })

    .catch((error)=>{

        alert("Error: "+error.message);

    });

};


/* SHOW NOTICES */

const noticesRef = ref(db,"notices");

onValue(noticesRef,(snapshot)=>{

    const data = snapshot.val();

    const list =
    document.getElementById("noticeList");

    list.innerHTML="";

    if(!data){

        list.innerHTML=
        "<p>अभी कोई notice नहीं है।</p>";

        return;

    }

    Object.entries(data).forEach(([id,notice])=>{

        const div =
        document.createElement("div");

        div.className="notice";

        div.innerHTML=`

            <strong>📢 ${notice.text}</strong>

            <br>

            <small>${notice.date || ""}</small>

            <br>

            <button class="delete"
            onclick="deleteNotice('${id}')">

            Delete

            </button>

        `;

        list.appendChild(div);

    });

});


/* DELETE NOTICE */

window.deleteNotice = function(id){

    if(!confirm("क्या आप यह notice delete करना चाहते हैं?")){
        return;
    }

    remove(ref(db,"notices/"+id))

    .then(()=>{

        alert("Notice delete हो गया।");

    })

    .catch((error)=>{

        alert("Error: "+error.message);

    });

};


/* LOAD SCHOOL DATA */

onValue(ref(db,"school"),(snapshot)=>{

    const data=snapshot.val();

    if(!data) return;

    if(data.name)
    document.getElementById("schoolName").value=data.name;

    if(data.address)
    document.getElementById("address").value=data.address;

    if(data.principal)
    document.getElementById("principal").value=data.principal;

    if(data.qualification)
    document.getElementById("qualification").value=
    data.qualification;

});


/* LOAD TEACHERS */

onValue(ref(db,"teachers"),(snapshot)=>{

    const data=snapshot.val();

    if(!data) return;

    for(let i=1;i<=8;i++){

        if(data["teacher"+i]){

            document.getElementById("teacher"+i).value=
            data["teacher"+i];

        }

    }

});

</script>

</body>
</html>
