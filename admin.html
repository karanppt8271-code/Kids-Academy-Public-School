<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kids Academy Public School - Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff8e9;
    color:#29150d;
}

header{
    background:#29150d;
    color:white;
    text-align:center;
    padding:25px;
}

header h1{
    color:#e5aa2e;
    margin-bottom:6px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    background:#e5aa2e;
    color:#29150d;
    border:0;
    padding:12px 22px;
    margin-top:18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

.success{
    margin-top:15px;
    font-weight:bold;
}

.error{
    margin-top:15px;
    color:#b00020;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>Kids Academy Public School</h1>
    <p>Admin Management Panel</p>
</header>

<div class="container">

<!-- SCHOOL INFORMATION -->

<div class="card">

<h2>🏫 School Information</h2>

<label>School Name</label>
<input id="schoolName">

<label>Address</label>
<input id="address">

<label>Principal Name</label>
<input id="principal">

<label>Qualification</label>
<input id="qualification">

<button id="saveSchoolBtn">
Save School Information
</button>

<p id="schoolMessage"></p>

</div>


<!-- TEACHERS -->

<div class="card">

<h2>👨‍🏫 Teachers</h2>

<input id="teacher1" placeholder="Teacher 1 Name">
<input id="teacher2" placeholder="Teacher 2 Name">
<input id="teacher3" placeholder="Teacher 3 Name">
<input id="teacher4" placeholder="Teacher 4 Name">
<input id="teacher5" placeholder="Teacher 5 Name">
<input id="teacher6" placeholder="Teacher 6 Name">
<input id="teacher7" placeholder="Teacher 7 Name">
<input id="teacher8" placeholder="Teacher 8 Name">

<button id="saveTeachersBtn">
Save Teachers
</button>

<p id="teacherMessage"></p>

</div>


<!-- NOTICE -->

<div class="card">

<h2>📢 Add School Notice</h2>

<textarea id="noticeText"
placeholder="यहाँ notice लिखें..."></textarea>

<button id="addNoticeBtn">
Add Notice
</button>

<p id="noticeMessage"></p>

<div id="noticeList"></div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    remove
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey: "AIzaSyDH5Qd0S0gfuCX519aN-K9eLQtZYReyJ4Q",

    authDomain:
    "kids-academy-public-school.firebaseapp.com",

    databaseURL:
    "https://kids-academy-public-school-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "kids-academy-public-school",

    storageBucket:
    "kids-academy-public-school.firebasestorage.app",

    messagingSenderId:
    "267983271088",

    appId:
    "1:267983271088:web:b172e2f3077492848bb775"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* LOAD SCHOOL */

onValue(ref(db,"school"), (snapshot) => {

    const data = snapshot.val();

    if(!data) return;

    document.getElementById("schoolName").value =
    data.name || "";

    document.getElementById("address").value =
    data.address || "";

    document.getElementById("principal").value =
    data.principal || "";

    document.getElementById("qualification").value =
    data.qualification || "";

});


/* SAVE SCHOOL */

document.getElementById("saveSchoolBtn").onclick = async function(){

    const schoolData = {

        name:
        document.getElementById("schoolName").value.trim(),

        address:
        document.getElementById("address").value.trim(),

        principal:
        document.getElementById("principal").value.trim(),

        qualification:
        document.getElementById("qualification").value.trim()

    };

    try{

        await set(ref(db,"school"),schoolData);

        document.getElementById("schoolMessage").className =
        "success";

        document.getElementById("schoolMessage").innerText =
        "✅ Firebase में School Information Save हो गई।";

    }
    catch(error){

        document.getElementById("schoolMessage").className =
        "error";

        document.getElementById("schoolMessage").innerText =
        "❌ Error: " + error.message;

    }

};


/* LOAD TEACHERS */

onValue(ref(db,"teachers"), (snapshot) => {

    const data = snapshot.val();

    if(!data) return;

    for(let i=1;i<=8;i++){

        document.getElementById("teacher"+i).value =
        data["teacher"+i] || "";

    }

});


/* SAVE TEACHERS */

document.getElementById("saveTeachersBtn").onclick = async function(){

    const teachers = {};

    for(let i=1;i<=8;i++){

        teachers["teacher"+i] =
        document.getElementById("teacher"+i).value.trim();

    }

    try{

        await set(ref(db,"teachers"),teachers);

        document.getElementById("teacherMessage").className =
        "success";

        document.getElementById("teacherMessage").innerText =
        "✅ Teachers Firebase में Save हो गए।";

    }
    catch(error){

        document.getElementById("teacherMessage").className =
        "error";

        document.getElementById("teacherMessage").innerText =
        "❌ Error: " + error.message;

    }

};


/* ADD NOTICE */

document.getElementById("addNoticeBtn").onclick = async function(){

    const text =
    document.getElementById("noticeText").value.trim();

    if(text === ""){

        alert("पहले Notice लिखिए।");

        return;
    }

    try{

        await push(ref(db,"notices"),{

            text:text,

            date:new Date().toLocaleDateString("hi-IN")

        });

        document.getElementById("noticeText").value = "";

        document.getElementById("noticeMessage").className =
        "success";

        document.getElementById("noticeMessage").innerText =
        "✅ Notice Firebase में Save हो गया।";

    }
    catch(error){

        document.getElementById("noticeMessage").className =
        "error";

        document.getElementById("noticeMessage").innerText =
        "❌ Error: " + error.message;

    }

};


/* SHOW NOTICE */

onValue(ref(db,"notices"), (snapshot) => {

    const data = snapshot.val();

    const list =
    document.getElementById("noticeList");

    list.innerHTML = "";

    if(!data){

        list.innerHTML =
        "<p>अभी कोई Notice नहीं है।</p>";

        return;
    }

    Object.entries(data).forEach(([id,item]) => {

        const box =
        document.createElement("div");

        box.style.padding = "15px";
        box.style.marginTop = "12px";
        box.style.background = "#fff8e9";
        box.style.borderRadius = "10px";

        box.innerHTML = `
            <b>📢 ${item.text}</b>
            <br>
            <small>${item.date || ""}</small>
            <br>
            <button>Delete</button>
        `;

        box.querySelector("button").onclick =
        async function(){

            if(confirm("यह Notice Delete करें?")){

                await remove(ref(db,"notices/"+id));

            }

        };

        list.appendChild(box);

    });

});

</script>

</body>
</html>
