<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>School Notice | Kids Academy Public School</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff8e9;
    color:#29150d;
}

/* HEADER */

header{
    background:#29150d;
    color:white;
    text-align:center;
    padding:25px 15px;
    border-bottom:4px solid #e5aa2e;
}

header img{
    width:75px;
    height:75px;
    object-fit:contain;
    background:white;
    padding:5px;
    border-radius:50%;
}

header h1{
    color:#e5aa2e;
    margin-top:10px;
    font-size:28px;
}

header p{
    margin-top:5px;
}

.back{
    display:inline-block;
    margin-top:15px;
    background:#e5aa2e;
    color:#29150d;
    text-decoration:none;
    padding:10px 20px;
    border-radius:25px;
    font-weight:bold;
}

/* MAIN */

.container{
    max-width:900px;
    margin:auto;
    padding:35px 18px;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h2{
    font-size:30px;
}

.line{
    width:70px;
    height:4px;
    background:#e5aa2e;
    margin:10px auto;
    border-radius:5px;
}

/* NOTICE */

.notice{
    background:white;
    margin-bottom:20px;
    padding:22px;
    border-radius:15px;
    border-left:5px solid #e5aa2e;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.notice-date{
    color:#9b5b00;
    font-weight:bold;
    font-size:14px;
    margin-bottom:12px;
}

.notice-text{
    color:#444;
    font-size:17px;
    line-height:1.8;
    white-space:pre-line;
}

/* LOADING */

.loading{
    text-align:center;
    background:white;
    padding:35px;
    border-radius:15px;
    color:#777;
}

/* EMPTY */

.empty{
    text-align:center;
    background:white;
    padding:35px;
    border-radius:15px;
    color:#777;
}

/* FOOTER */

footer{
    margin-top:40px;
    background:#29150d;
    color:white;
    text-align:center;
    padding:22px;
}

footer strong{
    color:#e5aa2e;
}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<img src="school-logo.png" alt="School Logo">

<h1>Kids Academy Public School</h1>

<p>Manikpur, Pirpainti Bazar</p>

<a href="index.html" class="back">
← Back to Home
</a>

</header>


<!-- MAIN -->

<div class="container">

<div class="title">

<h2>📢 School Notices</h2>

<div class="line"></div>

</div>


<div id="noticeList">

<div class="loading">
⏳ Loading Notices...
</div>

</div>

</div>


<!-- FOOTER -->

<footer>

© 2026 <strong>Kids Academy Public School</strong><br>

Manikpur, Pirpainti Bazar

</footer>



<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {

getDatabase,
ref,
onValue

}

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyDH5Qd0S0gfuCX519aN-K9eLQtZYReyJ4Q",

authDomain:
"kids-academy-public-school.firebaseapp.com",

databaseURL:
"https://kids-academy-public-school-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"kids-academy-public-school",

storageBucket:
"kids-academy-public-school.firebasestorage.app",

messagingSenderId:
"267983271088",

appId:
"1:267983271088:web:b172e2f3077492848bb775"

};



/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



/* GET NOTICE */

const noticeRef = ref(db,"notices");

const noticeList =
document.getElementById("noticeList");



onValue(noticeRef,(snapshot)=>{

const data = snapshot.val();


noticeList.innerHTML = "";



/* NO NOTICE */

if(!data){

noticeList.innerHTML = `

<div class="empty">

<h3>📢 अभी कोई Notice नहीं है</h3>

<p>School notices यहाँ दिखाई देंगे।</p>

</div>

`;

return;

}



/* NOTICE LIST */

const notices =
Object.entries(data).reverse();



notices.forEach(([id,item])=>{


const notice =
document.createElement("div");


notice.className="notice";


notice.innerHTML = `

<div class="notice-date">

📅 ${item.date || ""}

</div>


<div class="notice-text">

${item.text || ""}

</div>

`;


noticeList.appendChild(notice);


});


});

</script>


</body>

</html>
