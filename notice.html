</head>

<div class="container">

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyDH5Qd0S0gfuCX519aN-K9eLQtZYReyJ4Q",

    authDomain:
    "kids-academy-public-school.firebaseapp.com",

    databaseURL:
    "https://kids-academy-public-school-default-rtdb.asia-southeast1.firebasedatabase.app/",

    projectId:
    "kids-academy-public-school",

    storageBucket:
    "kids-academy-public-school.firebasestorage.app",

    messagingSenderId:
    "267983271088",

    appId:
    "1:267983271088:web:b172e2f3077492848bb775",

    measurementId:
    "G-P0KZKWBQFX"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const noticeRef = ref(db, "notices");

const noticeList =
document.getElementById("noticeList");


onValue(noticeRef, (snapshot) => {

    const data = snapshot.val();

    noticeList.innerHTML = "";

    if(!data){

        noticeList.innerHTML = `
            <div class="empty">
                <h3>📢 No Notice Available</h3>
                <p>School notices will appear here.</p>
            </div>
        `;

        return;
    }


    const notices = Object.values(data);


    notices.reverse();


    notices.forEach((notice) => {

        const card =
        document.createElement("div");

        card.className = "notice-card";


        card.innerHTML = `

            <div class="notice-date">
                📅 ${notice.date || "School Notice"}
            </div>

            <h3>
                ${notice.title || "School Notice"}
            </h3>

            <p>
                ${notice.message || ""}
            </p>

        `;


        noticeList.appendChild(card);

    });

});


</script>

</body>
</html>
